# Docker Compose for Local Development
# This builds the image locally and mounts the scraper data directory

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ivy-swim-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the scraper output directory so API can read JSON files
      - ./scraper:/app/data:ro
      # Mount the backend code for hot-reload during development
      - ./backend/main.py:/app/main.py
    environment:
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: ivy-swim-network
